<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in sessions - Job Agent</title>
  <link rel="stylesheet" href="/static/css/auth.css">
  <style>
    .session-list{display:grid;gap:14px}
    .session-card{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px}
    .session-card h2{margin:0 0 8px;font-size:16px;overflow-wrap:anywhere}
    .session-card p{margin:4px 0;color:#6b7280;font-size:14px}
    .session-actions{display:flex;align-items:center;gap:10px}
    .current-chip{display:inline-block;padding:3px 9px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:12px;font-weight:700}
    .danger-btn{height:36px;padding:0 12px;border:1px solid #fda29b;border-radius:6px;background:#fff;color:#b42318;font:600 13px Arial,sans-serif;cursor:pointer}
    .danger-btn:hover{background:#fef3f2}
    @media(max-width:650px){.session-card{align-items:flex-start;flex-direction:column}.session-actions{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-icon">AI</div><div><h2>Job Agent</h2><span>Sign-in sessions</span></div></div>
  <a href="/">Back to the app</a>
</header>
<main class="admin-main">
  <div class="page-header">
    <div><h1>Your sessions</h1><p class="sub">Review signed-in devices and sign out sessions you no longer recognize.</p></div>
    <button id="revokeOthers" class="small-btn" type="button">Sign out other sessions</button>
  </div>
  <div id="msg" class="msg" role="status" hidden></div>
  <div id="sessionList" class="session-list" aria-live="polite"></div>
</main>
<script src="/static/js/account_sessions.js"></script>
</body>
</html>
