<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in sessions - Job Agent</title>
  <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-icon">AI</div>
    <div><h2>Job Agent</h2><span>Sign-in sessions</span></div>
  </div>
  <a href="/">← Back to the app</a>
</header>
<main class="admin-main">
  <div class="page-header">
    <div>
      <h1>Your sessions</h1>
      <p class="sub">Review signed-in devices and sign out sessions you no longer recognize.</p>
    </div>
    <button id="revokeOthers" class="small-btn" type="button">Sign out other sessions</button>
  </div>
  <div id="msg" class="msg" role="status" hidden></div>
  <div id="sessionList" class="session-list" aria-live="polite"></div>
</main>
<script src="/static/js/account_sessions.js"></script>
</body>
</html>
