<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>izealinc.ai</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=20261112-admin-links">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✣</span><span>izealinc.ai</span></div>
    <nav id="main-nav" aria-label="Main navigation">
      <button type="button" data-page="dashboard" class="nav-item active">▦ <span>Dashboard</span></button>
      <button type="button" data-page="jobs" class="nav-item">▣ <span>Jobs</span></button>
      <button type="button" data-page="candidates" class="nav-item">◎ <span>Candidates</span></button>
      <button type="button" data-page="matching" class="nav-item">✦ <span>Matching</span></button>
      <button type="button" data-page="submissions" class="nav-item">⇢ <span>Submissions</span></button>
      <button type="button" data-page="reports" class="nav-item">▤ <span>Reports</span></button>
      <button type="button" data-page="admin" class="nav-item">♙ <span>Admin</span></button>
      <button type="button" data-page="integrations" class="nav-item">⛓ <span>Integrations</span></button>
      <button type="button" data-page="settings" class="nav-item">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-foot"><strong>AI Powered Recruiting</strong><small>Smarter matches. Faster decisions.</small></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Toggle menu">☰</button>
      <div class="page-heading"><h1 id="page-title">Recruiter Dashboard</h1><p id="page-subtitle">Your recruiting command center</p></div>
      <div class="top-actions">
        <a class="icon-btn" href="/account/sessions" aria-label="Manage sessions" title="Manage sessions">♢</a>
        <span class="avatar" aria-hidden="true">{{ (current_user or {}).get('name', (current_user or {}).get('email', 'A'))[:2]|upper }}</span>
        <span class="user-name">{{ (current_user or {}).get('name', (current_user or {}).get('email', 'Account')) }}</span>
        <button id="sign-out" class="icon-btn" type="button" aria-label="Sign out" title="Sign out">↪</button>
      </div>
    </header>
    <section id="content" class="content" aria-live="polite"></section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>window.IZEALINC_USER={{ (current_user or {})|tojson }};</script>
<script src="{{ url_for('static', path='js/app.js') }}?v=20261112-admin-links"></script>
</body>
</html>
